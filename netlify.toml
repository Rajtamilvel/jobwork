[build]
  command = "npm --prefix client install && npm --prefix client run build && node -e \"const fs=require('fs'); fs.cpSync('client/dist', 'dist', {recursive: true, force: true});\""
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://jobwork-rajtamils-projects.vercel.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
